<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ</title>
    <meta name="description" content="テキストテキストテキストテキストテキストテキストテキストテキスト">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="img/favicon.png">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&display=swap"
        rel="stylesheet">
</head>

<body class="contact-page">
    <header id="header">
        <img src="img/mainvisual.jpeg" alt="">
        <div class="hero">
            <div class="hero-title">
                <h1>NORIKO’S</h1>
                <h2>PORTFOLIO</h2>
            </div>
        </div>
    </header>

    <section id="contact">
        <!-- パンクズリスト -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">ホーム</a></li>
                <li class="breadcrumb-item"><a href="index.html#works">works</a></li>
                <li class="breadcrumb-item active" aria-current="page">詳細</li>
            </ol>
        </nav>

        <form action="https://formspree.io/f/mdkqjjoj" method="POST" class="wrapper contact-form">

            <h1>contact</h1>

            <p>
                制作の依頼・ご相談などお気軽にお問い合わせくださいませ。<br>
                下記フォームよりわかる範囲でご記入ください。
            </p>

            <dl>
                <dt><label for="name">お名前</label></dt>
                <dd>
                    <input type="text" id="name" name="name" required>
                </dd>

                <dt><label for="email">メールアドレス</label></dt>
                <dd>
                    <input type="email" id="email" name="email" required>
                </dd>

                <dt><label for="message">お問い合わせ内容</label></dt>
                <dd>
                    <textarea id="message" name="message" required></textarea>
                </dd>
            </dl>

            <!-- 日本語件名 -->
            <input type="hidden" name="_subject" value="【お問い合わせ】ポートフォリオより">

            <!-- スパム対策 -->
            <input type="text" name="_gotcha" style="display:none">

            <div class="contact-actions">
                <button type="submit" class="btn btn-primary">
                    送信する
                </button>
            </div>

        </form>
        <!-- サブ -->
        <p class="contact-sub-text">
            フォーム入力が難しい場合は
        </p>

        <div class="contact-sub-actions">
            <a href="https://lin.ee/joA8kD2" class="btn btn-secondary">
                LINEでメッセージ
            </a>

            <a href="mailto:sakuratns@icloud.com" class="btn btn-secondary">
                ✉ メールで問い合わせる
            </a>
        </div>

        <!-- ====================
         FOOTER
    ==================== -->
        <footer>
            <p class="copy">© noriko.2026</p>
        </footer>
    </section>

</body>

</html>
